<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0A0A0C"/>
  <!-- Ribbon Bow -->
  <g fill="none" stroke="#D98A95" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center knot -->
    <circle cx="50" cy="46" r="4.5" fill="#C4727F" stroke="#D98A95" stroke-width="2"/>
    <!-- Left Loop -->
    <path d="M46 45 C35 38, 20 40, 22 50 C24 57, 40 52, 46 48" fill="rgba(217, 138, 149, 0.25)"/>
    <!-- Right Loop -->
    <path d="M54 45 C65 38, 80 40, 78 50 C76 57, 60 52, 54 48" fill="rgba(217, 138, 149, 0.25)"/>
    <!-- Left Ribbon Tail -->
    <path d="M48 49 C42 60, 48 72, 38 82"/>
    <!-- Right Ribbon Tail -->
    <path d="M52 49 C58 60, 52 72, 62 82"/>
  </g>
</svg>